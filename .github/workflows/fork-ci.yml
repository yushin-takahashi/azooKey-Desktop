# フォーク用 CI（azooKey Shift）
#
# 上流の swift.yml（macos-15 / Xcode 16.3 / Ubuntu）はファイルを変えずに、フォークの Actions 設定で無効にしている。
# ここでは README の要件（Xcode 26.1 以上）に合う macos-26 ランナーの Xcode で検証する。
# Xcode 16.3 の SDK には FoundationModels がないため、上流の CI では AI バックエンドの一部が
# コンパイルされない。このワークフローは配布物と同じ構成でビルドする。
#
# 署名はしない。証明書・チームID・Secrets は使わない。
#
# macOS arm64 ランナーは混雑時に割り当てられないことがあるため、検証を1つのジョブにまとめ、
# 必要なランナーを1台にしている（ジョブを分けると、どれか1つが割り当て待ちで打ち切られやすい）。
name: Fork CI

on:
  push:
    branches: [feature/shift-english]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SwiftLint, Core test, Release build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint

      - name: SwiftLint (strict)
        run: |
          swiftlint version
          swiftlint --quiet --strict

      - name: Build Core
        run: swift build --package-path Core --build-tests

      - name: Test Core
        run: swift test --package-path Core --skip-build

      - name: Build azooKeyMac (Release, unsigned)
        run: |
          xcodebuild \
            -project azooKeyMac.xcodeproj \
            -scheme azooKeyMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
